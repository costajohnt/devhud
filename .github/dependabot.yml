version: 2
updates:
  # Two npm packages, each with its own lockfile (root, which also carries
  # the MCP server's deps, and web/); CI runs `npm ci` for both.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
