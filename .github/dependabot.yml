version: 2
updates:
  # Three independent npm packages, each with its own lockfile; CI runs
  # `npm ci` for all three, so each needs its own entry to stay current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
