<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>devhud</title>
    <script>
      // Pre-paint theme: explicit choice wins, otherwise fall back to the OS
      // preference so there's no flash of the wrong theme before main.tsx's
      // getInitialTheme() (app.tsx) runs the same logic. Storage access is
      // guarded (blocked site data throws), matching storage.ts.
      {
        let saved = null;
        try { saved = localStorage.getItem('devhud-theme'); } catch { /* blocked */ }
        document.documentElement.dataset.theme = saved
          || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
